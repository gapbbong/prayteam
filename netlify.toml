functionsDirectory = "netlify/functions"

[build]
publish = "."
functions = "netlify/functions"


  [build.environment]

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]

[functions]

  [functions."*"]

[[redirects]]
from = "/app-config.js"
to = "/app-config.js"
status = 200
force = false

  [redirects.query]

  [redirects.conditions]

  [redirects.headers]

[[redirects]]
from = "/api"
to = "/.netlify/functions/proxy"
status = 200
force = true

  [redirects.query]

  [redirects.conditions]

  [redirects.headers]